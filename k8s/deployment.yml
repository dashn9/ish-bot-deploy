apiVersion: apps/v1
kind: Deployment
metadata:
  name: webbot
  namespace: bots
  labels:
    app: webbot
    type: ishbot
spec:
  template:
    metadata:
      name: webbot-pod
      labels:
        app: webbot
        type: ishbot
    spec:
      containers:
        - name: webbot
          image: us-east4-docker.pkg.dev/ish-bot/ish-bot/ish_bot:dbe6cfd70448bd6d124af5610b7b41dddbdc415b
          envFrom:
            - secretRef:
                name: ish-bot-proxy-auths
          ports:
            - containerPort: 5900
              name: vnc
          resources:
          volumeMounts:
          - name: config-volume
            mountPath: /app/configs

      volumes:
      - name: config-volume
        configMap:
          name: ish-bot-config

  replicas: 1
  selector:
    matchLabels:
      type: ishbot
